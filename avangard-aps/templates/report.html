<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отчёт — {{ title }}</title>
  <link rel="stylesheet" href="css/report.css">
</head>
<body>
  <header>
    <h1>{{ title }}</h1>
    <p class="meta">Сформирован: {{ generated_at }}</p>
  </header>

  <main>
    <section class="summary">
      <h2>Сводка</h2>
      {{ summary }}
    </section>

    <section class="details">
      <h2>Детали</h2>
      {{ details }}
    </section>
  </main>

  <footer>
    <p>Avangard APS v5</p>
  </footer>

  <script src="js/report.js"></script>
</body>
</html>
